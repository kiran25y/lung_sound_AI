[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanil-lung-ai"
version = "0.1.0"
description = "Hanil lung-sound AI pipeline (Normal/Crackle/Wheeze) with ESP32-S3 deployment"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
